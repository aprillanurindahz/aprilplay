name: aprilplay
description: "A Simple CRUD Music App using Riverpod and Supabase"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  supabase_flutter: ^2.8.4
  json_annotation: ^4.9.0

  sizer: ^3.0.1
  google_fonts: ^6.2.1

  audioplayers: ^6.0.0
  file_picker: ^8.1.4
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.5.4
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.5
  freezed: ^3.1.0

flutter:
  uses-material-design: true
